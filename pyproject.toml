[project]
name = "judge-robustness"
version = "0.1.0"
description = "Fixed attack suite that measures false-positive reward rates of shipped RL verifiers."
readme = "README.md"
authors = [
    { name = "Ankit Jha", email = "ankit.jha@tradomate.one" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pinned so results describe one released version.
    "reasoning-gym==0.1.25",
]

[project.scripts]
judge-robustness = "judge_robustness.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Logic symbols are the task notation, not typos.
"**/{formats,test_*}.py" = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
